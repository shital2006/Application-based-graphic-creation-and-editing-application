
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Graphics Application</title>
</head>
<body>

    <h1>Vector Graphics Creation and Editing Application</h1>

    <svg width="800" height="500"
         viewBox="0 0 800 500"
         xmlns="http://www.w3.org/2000/svg"
         style="border: 2px solid black; background-color: white;">

        <!-- Background -->
        <rect x="0" y="0"
              width="800" height="500"
              fill="#f1f5f9"/>

        <!-- Rectangle -->
        <rect x="50" y="50"
              width="200" height="100"
              fill="#3b82f6"
              stroke="#1e3a8a"
              stroke-width="3"/>

        <!-- Circle -->
        <circle cx="350" cy="100"
                r="50"
                fill="#22c55e"
                stroke="#166534"
                stroke-width="3"/>

        <!-- Line -->
        <line x1="450" y1="50"
              x2="600" y2="150"
              stroke="#ef4444"
              stroke-width="5"/>

        <!-- Ellipse -->
        <ellipse cx="150" cy="250"
                 rx="90" ry="45"
                 fill="#facc15"
                 stroke="#a16207"
                 stroke-width="3"/>

        <!-- Polygon -->
        <polygon points="350,200 300,300 400,300"
                 fill="#a855f7"
                 stroke="#6b21a8"
                 stroke-width="3"/>

        <!-- Text -->
        <text x="450" y="260"
              font-size="28"
              fill="#0f172a"
              font-family="Arial">
            Vector Graphics
        </text>

        <!-- Path -->
        <path d="M 50 380 C 100 300, 200 460, 280 380"
              fill="none"
              stroke="#f97316"
              stroke-width="5"/>

    </svg>

</body>
</html>
